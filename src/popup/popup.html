<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <img src="../../icons/icon32.png" alt="" width="20" height="20" />
    <h1>ThreadPort</h1>
    <span class="lang" data-i18n-title="langTitle">
      <button type="button" data-lang="en">EN</button><button type="button" data-lang="es">ES</button>
    </span>
    <span id="quota" class="quota" data-i18n-title="quotaTitle"></span>
  </header>

  <main>
    <div id="review" class="review hidden">
      <span data-i18n="review"></span>
      <button id="review-dismiss" data-i18n-title="reviewDismiss">×</button>
    </div>

    <div id="state-unsupported" class="state hidden">
      <p data-i18n="unsupported"></p>
    </div>

    <div id="state-enable" class="state hidden">
      <p id="enable-text"></p>
      <p class="dim" data-i18n="enableDim"></p>
      <button id="enable-btn" class="upgrade" data-i18n="enableBtn"></button>
    </div>

    <div id="state-loading" class="state hidden">
      <p data-i18n="loading"></p>
      <p class="dim" data-i18n="loadingDim"></p>
    </div>

    <div id="state-empty" class="state hidden">
      <p id="empty-text" data-i18n="empty"></p>
      <p class="dim" data-i18n="emptyDim"></p>
    </div>

    <div id="state-ready" class="state hidden">
      <p id="detected" class="detected"></p>
      <p class="dim send-to" data-i18n="continueOn"></p>
      <div id="targets" class="targets"></div>
      <label class="autosend">
        <input type="checkbox" id="autosend" />
        <span data-i18n="autosend"></span>
      </label>
      <p id="pro-hint" class="dim pro-hint hidden"></p>
    </div>

    <div id="state-limit" class="state hidden">
      <p data-i18n="limitTitle"></p>
      <p class="dim" data-i18n="limitDim"></p>
      <button id="upgrade" class="upgrade" data-i18n="upgrade"></button>
    </div>

    <div id="export" class="export hidden">
      <span class="dim label" data-i18n="saveCopy"></span>
      <button id="copy-md" class="link-btn" data-i18n="copyMd"></button>
      <span class="dim sep">·</span>
      <button id="download-md" class="link-btn" data-i18n="downloadMd"></button>
    </div>

    <p id="status" class="status hidden"></p>
  </main>
</body>
<script src="../lib/ExtPay.js"></script>
<script src="../common/platforms.js"></script>
<script src="../common/transcript.js"></script>
<script src="i18n.js"></script>
<script src="popup.js"></script>
</html>
